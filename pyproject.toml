[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-pulse"
version = "0.1.0"
description = "Local evidence-backed repository maintenance analyzer"
requires-python = ">=3.9"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "RepoPulse contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
repo-pulse = "repo_pulse.cli:main"
